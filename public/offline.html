<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Developer Portfolio</title>
  <style>
    :root {
      --bg: #0a0f1d;
      --card: #141c30;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    h1 {
      margin: 0 0 0.75rem 0;
      font-size: 1.5rem;
      font-weight: 700;
    }
    p {
      color: var(--muted);
      margin: 0 0 1.5rem 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #04101e;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .bilingual-hint {
      margin-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>You are currently offline</h1>
    <p>You can still view cached sections of this portfolio, but some dynamic actions require an active internet connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="bilingual-hint" dir="rtl">
      أنت تتصفح بدون اتصال بالإنترنت حالياً. يمكنك تصفح المحتوى المحفوظ مسبقاً في التطبيق.
    </div>
  </div>
</body>
</html>
