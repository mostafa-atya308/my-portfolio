<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mostafa Atya</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Single Page Application redirect for GitHub Pages
      // Ensures deep linking or refreshing doesn't result in a 404 page
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">mostafa Atya Portfolio</a>...</p>
  </body>
</html>
